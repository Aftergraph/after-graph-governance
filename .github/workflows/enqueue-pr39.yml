name: Enqueue Governance PR39

on:
  push:
    branches:
      - feat/external-normative-source-profile
    paths:
      - '.github/workflows/enqueue-pr39.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  enqueue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enqueue PR 39 through required merge queue
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: 5156ca18614bc5b596e7be8a7bf02d7f95c13ade
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(gh pr view 39 --repo Aftergraph/after-graph-governance --json headRefOid --jq .headRefOid)"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
          gh pr merge 39             --repo Aftergraph/after-graph-governance             --squash             --match-head-commit "$EXPECTED_HEAD"
