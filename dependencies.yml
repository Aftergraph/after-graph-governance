# Aftergraph — cross-repo dependency and ownership graph
# Machine-readable; CI/agents can parse this.
# Exact heads are NEVER stored here. Repository scope/roles live in
# docs/platform-topology/2.0.json; exact remote state is generated by
# scripts/org-state-verify.sh into latest-org-state.json.
# Module names, repo identities and roles MUST match the topology/2.0
# projection (see scripts/platform_topology.py parse_dependency_projection).
version: 4
topology_ref: docs/platform-topology/2.0.json
modules:
  after-graph-governance:
    repo: Aftergraph/after-graph-governance
    role: canonical-contracts
    consumes: []
    provides: [platform-topology/2.0, mission-state/1.0, policy.token/1.0, org-state/1.0, reconciliation-matrix]

  aie:
    repo: Aftergraph/aie
    role: normative-authority
    consumes: [after-graph-governance.mission-state/1.0]
    provides: [Principal, Role, AuthorityLease, MissionContract, PolicyDecisionRecord, DelegationRecord, BudgetLedger, TopologyMutation, RevocationRecord, EvidenceRecord, SettlementRecord]

  trust-gateway:
    repo: Aftergraph/trust-gateway
    role: runtime-enforcement
    consumes: [aie, works-execution.evidence-verdicts, after-graph-governance.mission-state/1.0, after-graph-governance.policy.token/1.0]
    provides: [runtime-admission, approvals, policy-enforcement, hash-chain-audit, rbac, budgets, providers, computer-sessions, plugin-runtime, artifacts]

  runtime:
    repo: Aftergraph/runtime
    role: agent-runtime
    consumes: [after-graph-governance.mission-state/1.0, aie, trust-gateway, works-execution]
    provides: [agent-lifecycle, orchestration, dispatch, checkpoints, metering, observability]

  works-execution:
    repo: Aftergraph/works-execution
    role: durable-execution
    consumes: [aie, after-graph-governance.mission-state/1.0]
    provides: [durable-work, workgraph, scheduler, workers, leases, sandbox, recovery, evidence-bundles, quittance, company-brain]

  studio:
    repo: Aftergraph/studio
    role: primary-experience
    consumes: [after-graph-governance, aie, trust-gateway, works-execution, wi-backend]
    provides: [chat-surface, work-surface, space-surface, needs-you, approvals-ui, evidence-ui, replay-ui]

  wi-backend:
    repo: Aftergraph/wi-backend
    role: work-inference
    consumes: [after-graph-governance]
    provides: [observations, work-candidates, work-items, review, publication, works-promotion, evidence-envelopes]

  wi-frontend:
    repo: Aftergraph/wi-frontend
    role: work-intelligence-experience
    consumes: [wi-backend, brand]
    provides: [specialist-web-experience, least-privilege-bff, workspace-connectors]

  context-continuity:
    repo: Aftergraph/context-continuity
    role: continuity-contract
    consumes: [after-graph-governance, intelligence-systems-research]
    provides: [continuity-capsule, context-handshake, deterministic-delta, merge, role-projection]

  continuum:
    repo: Aftergraph/continuum
    role: continuity-containment-verification
    consumes: [after-graph-governance, intelligence-systems-research, context-continuity, aie, works-execution]
    provides: [continuity-campaigns, containment-campaigns, fault-injection, mission-bench-harness]

  sentinel:
    repo: Aftergraph/sentinel
    role: verified-code-review
    consumes: [after-graph-governance]
    provides: [verified-code-review-verdicts, stale-base-invalidation, evidence-backed-verdicts]

  sentinel-firetest:
    repo: Aftergraph/sentinel-firetest
    role: temporary-verification-fixture
    consumes: [sentinel]
    provides: [live-fire-fixture]

  intelligence-systems-research:
    repo: Aftergraph/intelligence-systems-research
    role: research-assurance
    consumes: [after-graph-governance, aie, works-execution, trust-gateway]
    provides: [SPEC-001, MISSION-Bench, conformance, empirical-studies, assurance, publication-evidence]

  skills-vault:
    repo: Aftergraph/skills-vault
    role: capability-supply-chain
    consumes: [after-graph-governance]
    provides: [skill-registry, trust-lifecycle, provenance-lock, discovery, routing, governed-profile-distribution]

  llm-research-development:
    repo: Aftergraph/llm-research-development
    role: model-rnd-methodology
    consumes: [intelligence-systems-research, skills-vault]
    provides: [experiment-contracts, evaluation-contracts, promotion-rules, dataset-provenance-rules, model-development-methodology]

  afm:
    repo: Aftergraph/afm
    role: model-program
    consumes: [llm-research-development]
    provides: [afm-training, afm-datasets, afm-experiments, afm-evals, model-cards, artifact-manifests]

  model-registry:
    repo: Aftergraph/model-registry
    role: model-lifecycle-registry
    consumes: [llm-research-development, afm]
    provides: [model-identities, immutable-versions, aliases, lifecycle-state, artifact-locations, release-metadata]

  autonomous-venture-company:
    repo: Aftergraph/autonomous-venture-company
    role: legacy-migration-source
    consumes: [after-graph-governance, aie, works-execution, trust-gateway, skills-vault]
    provides: [legacy-venture-os, hermes-migration-source, product-cells-migration-source, reference-consumer]

  aftergraph-cron-fabric:
    repo: Aftergraph/aftergraph-cron-fabric
    role: scheduled-observation-fabric
    consumes: [after-graph-governance]
    provides: [scheduled-observation, evidence-gating, dedupe, escalation]

  veranza:
    repo: Aftergraph/veranza
    role: assurance-incubation
    consumes: [after-graph-governance]
    provides: [incubation-concept]

  docs:
    repo: Aftergraph/docs
    role: knowledge-plane
    consumes: [after-graph-governance, aie, works-execution, trust-gateway, intelligence-systems-research, wi-backend, brand]
    provides: [human-docs, api-reference, contract-explorer, claim-rendering, context-packs, docs-mcp, provenance-freshness]

  aftergraph.org:
    repo: Aftergraph/aftergraph.org
    role: public-front-door
    consumes: [after-graph-governance, docs, brand]
    provides: [marketing-front-door, organization-routing, public-system-map, launcher]

  brand:
    repo: Aftergraph/brand
    role: brand-design-system
    consumes: []
    provides: [design-tokens, master-assets, iconography, public-communication-rules]

  .github:
    repo: Aftergraph/.github
    role: organization-community
    consumes: [after-graph-governance, brand]
    provides: [organization-profile, contribution-defaults, security-routing, support-routing, community-health]
