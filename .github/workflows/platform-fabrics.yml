name: Platform Fabrics Conformance

on:
  pull_request:
    paths:
      - 'docs/contracts/platform-event-ref/**'
      - 'docs/contracts/capability-action/**'
      - 'docs/contracts/tool-fabric/**'
      - 'docs/experience-surfaces/**'
      - 'docs/contracts/world-assertion/**'
      - 'docs/contracts/situation/**'
      - 'docs/contracts/consent-ledger/**'
      - 'docs/contracts/tenant-lifecycle/**'
      - 'docs/contracts/proactivity/**'
      - 'docs/contracts/org-delegation/**'
      - 'docs/contracts/agent-eval/**'
      - 'docs/contracts/pocket-source/**'
      - 'docs/contracts/voice-interaction/**'
      - 'docs/contracts/promotion-gates/**'
      - 'docs/contracts/frontier-lifecycle/**'
      - 'docs/contracts/economic-graph/**'
      - 'docs/AFTERGRAPH-FRONTIER-V1.md'
      - 'docs/ECONOMIC-GRAPH-V1.md'
      - 'docs/frontier/**'
      - 'docs/evidence/promotions/**'
      - 'scripts/test_frontier_economic_graph_v1.py'
      - 'scripts/test_economic_canonical_readiness_v2.py'
      - 'scripts/test_economic_signer_canary_v3.py'
      - 'scripts/test_economic_signer_provider_v4.py'
      - 'scripts/test_economic_custody_canary_v5.py'
      - 'scripts/test_economic_correlation_v6.py'
      - 'scripts/test_economic_legal_reconciliation_v7.py'
      - 'scripts/test_economic_right_source_readonly_v8.py'
      - 'scripts/test_economic_evidence_coherence_v9.py'
      - 'scripts/test_economic_live_canary_assurance_v10.py'
      - 'docs/contracts/avc-dissolution/**'
      - 'docs/platform-conformance/**'
      - 'docs/platform-conformance/economic-live-settlement-v1/**'
      - 'docs/golden-mission/**'
      - 'docs/superpowers/requests/**'
      - 'scripts/test_platform_fabrics_v0_1.py'
      - 'scripts/test_tool_fabric_v0_1.py'
      - 'scripts/test_experience_surfaces.py'
      - 'scripts/test_golden_mission_skeleton_v0_1.py'
      - 'scripts/test_wave_b_requests_v0_1.py'
      - 'scripts/test_wave_c_requests_v0_1.py'
      - 'scripts/test_wave_d_requests_v0_1.py'
      - 'scripts/test_world_state_conformance_v0_1.py'
      - '.github/workflows/platform-fabrics.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/platform-event-ref/**'
      - 'docs/contracts/capability-action/**'
      - 'docs/contracts/tool-fabric/**'
      - 'docs/experience-surfaces/**'
      - 'docs/contracts/world-assertion/**'
      - 'docs/contracts/situation/**'
      - 'docs/contracts/consent-ledger/**'
      - 'docs/contracts/tenant-lifecycle/**'
      - 'docs/contracts/proactivity/**'
      - 'docs/contracts/org-delegation/**'
      - 'docs/contracts/agent-eval/**'
      - 'docs/contracts/pocket-source/**'
      - 'docs/contracts/voice-interaction/**'
      - 'docs/contracts/promotion-gates/**'
      - 'docs/contracts/frontier-lifecycle/**'
      - 'docs/contracts/economic-graph/**'
      - 'docs/AFTERGRAPH-FRONTIER-V1.md'
      - 'docs/ECONOMIC-GRAPH-V1.md'
      - 'docs/frontier/**'
      - 'docs/evidence/promotions/**'
      - 'scripts/test_frontier_economic_graph_v1.py'
      - 'docs/contracts/avc-dissolution/**'
      - 'docs/platform-conformance/**'
      - 'docs/platform-conformance/economic-live-settlement-v1/**'
      - 'docs/golden-mission/**'
      - 'docs/superpowers/requests/**'
      - 'scripts/test_platform_fabrics_v0_1.py'
      - 'scripts/test_tool_fabric_v0_1.py'
      - 'scripts/test_experience_surfaces.py'
      - 'scripts/test_golden_mission_skeleton_v0_1.py'
      - 'scripts/test_wave_b_requests_v0_1.py'
      - 'scripts/test_wave_c_requests_v0_1.py'
      - 'scripts/test_wave_d_requests_v0_1.py'
      - 'scripts/test_world_state_conformance_v0_1.py'
      - '.github/workflows/platform-fabrics.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Phase-0 platform fabric conformance
        run: python scripts/test_platform_fabrics_v0_1.py
      - name: Run ToolFabric governance conformance
        run: python scripts/test_tool_fabric_v0_1.py
      - name: Run experience-surface governance
        run: python scripts/test_experience_surfaces.py
      - name: Run Golden Mission skeleton conformance
        run: python scripts/test_golden_mission_skeleton_v0_1.py
      - name: Run Wave B request conformance
        run: python scripts/test_wave_b_requests_v0_1.py
      - name: Run World State conformance
        run: python scripts/test_world_state_conformance_v0_1.py
      - name: Run Wave C request conformance
        run: python scripts/test_wave_c_requests_v0_1.py
      - name: Run Wave D request conformance
        run: python scripts/test_wave_d_requests_v0_1.py
      - name: Run Frontier and Economic Graph governance
        run: python scripts/test_frontier_economic_graph_v1.py
      - name: Run Economic real-rail evidence verifier tests
        run: python scripts/test_economic_real_rail_evidence.py
      - name: Run Economic canonical-readiness v2 tests
        run: python scripts/test_economic_canonical_readiness_v2.py
      - name: Run Economic signer canary v3 tests
        run: python scripts/test_economic_signer_canary_v3.py
      - name: Run Economic signer provider v4 tests
        run: python scripts/test_economic_signer_provider_v4.py
      - name: Run Economic custody canary v5 tests
        run: python scripts/test_economic_custody_canary_v5.py
      - name: Run Economic correlation v6 tests
        run: python scripts/test_economic_correlation_v6.py
      - name: Run Economic legal reconciliation v7 tests
        run: python scripts/test_economic_legal_reconciliation_v7.py
      - name: Run Economic right source read-only v8 tests
        run: python scripts/test_economic_right_source_readonly_v8.py
      - name: Run Economic evidence coherence v9 tests
        run: python scripts/test_economic_evidence_coherence_v9.py
      - name: Run Economic live-canary assurance v10 tests
        run: python scripts/test_economic_live_canary_assurance_v10.py
