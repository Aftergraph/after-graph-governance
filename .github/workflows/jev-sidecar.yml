name: Jev Sidecar Contracts

on:
  pull_request:
    paths:
      - 'docs/contracts/jev-sidecar/**'
      - 'scripts/test_jev_sidecar_v0_1.py'
      - '.github/workflows/jev-sidecar.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/jev-sidecar/**'
      - 'scripts/test_jev_sidecar_v0_1.py'
      - '.github/workflows/jev-sidecar.yml'

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate JSON syntax
        run: |
          python -m json.tool docs/contracts/jev-sidecar/0.1.registry.json >/dev/null
          python -m json.tool docs/contracts/jev-sidecar/0.1.observation.schema.json >/dev/null
          python -m json.tool docs/contracts/jev-sidecar/0.1.promotion.schema.json >/dev/null
      - name: Run Jev sidecar contract tests
        run: python -m unittest scripts.test_jev_sidecar_v0_1 -v
