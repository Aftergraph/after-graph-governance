name: Release Intelligence

on:
  pull_request:
    paths:
      - 'docs/contracts/aftergraph-component/**'
      - 'docs/contracts/compatibility-edge/**'
      - 'docs/contracts/release-passport/**'
      - 'docs/contracts/release-registry/**'
      - 'docs/contracts/rbom/**'
      - 'docs/contracts/external-normative-source/**'
      - 'docs/release-intelligence/external-sources/**'
      - 'docs/release-intelligence/**'
      - 'scripts/ari_*.py'
      - 'scripts/test_ari_*.py'
      - '.github/workflows/release-intelligence.yml'
      # AriDiscoverabilityTest gates the cross-repo register and the two frozen
      # ARI design documents; without these paths a PR editing only them skips
      # the very suite that protects them.
      - 'docs/cross-repo-contracts.md'
      - 'docs/superpowers/specs/2026-09-07-aftergraph-release-intelligence-plane-design.md'
      - 'docs/superpowers/specs/2026-09-07-aftergraph-release-lifecycle-compatibility-standard-design.md'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/aftergraph-component/**'
      - 'docs/contracts/compatibility-edge/**'
      - 'docs/contracts/release-passport/**'
      - 'docs/contracts/release-registry/**'
      - 'docs/contracts/rbom/**'
      - 'docs/release-intelligence/**'
      - 'scripts/ari_*.py'
      - 'scripts/test_ari_*.py'
      - '.github/workflows/release-intelligence.yml'
      # AriDiscoverabilityTest gates the cross-repo register and the two frozen
      # ARI design documents; without these paths a PR editing only them skips
      # the very suite that protects them.
      - 'docs/cross-repo-contracts.md'
      - 'docs/superpowers/specs/2026-09-07-aftergraph-release-intelligence-plane-design.md'
      - 'docs/superpowers/specs/2026-09-07-aftergraph-release-lifecycle-compatibility-standard-design.md'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run ARI unit tests
        run: python -m unittest discover -s scripts -p 'test_ari_*.py' -v
      - name: Run governance regression tests
        run: >-
          python -m unittest
          scripts.test_platform_convergence_v2_1_contracts
          scripts.test_governance_ci_result
          scripts.test_governance_ci_truth_reducer
          scripts.test_governance_clean_room
          scripts.test_governance_exact_head_truth
          scripts.test_verify_brand_assets
          -v
      - name: Validate ARI JSON
        run: |
          python -m json.tool docs/release-intelligence/apc-1.json >/dev/null
          python -m json.tool docs/contracts/aftergraph-component/1.0.json >/dev/null
          python -m json.tool docs/contracts/compatibility-edge/1.0.json >/dev/null
          python -m json.tool docs/contracts/release-passport/1.0.json >/dev/null
          python -m json.tool docs/contracts/release-registry/1.0.json >/dev/null
          python -m json.tool docs/contracts/rbom/0.1.json >/dev/null
          python -m json.tool docs/contracts/external-normative-source/0.1.json >/dev/null
          for f in docs/release-intelligence/external-sources/*.json; do python -m json.tool "$f" >/dev/null; done